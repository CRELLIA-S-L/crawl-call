# SRS-DD-0.19.0 specification gate.
# Template copied into target projects as .github/workflows/srs.yml by
# tools/srs_init.py.

name: srs

on:
  push:
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      # The whole history: the baselines the rendered page compares are
      # commits in it, and the default shallow checkout holds none of them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Add --strict to fail on warnings as well.
      - name: Validate specification
        run: python3 tools/srs_check.py

      - name: Traceability matrix is fresh
        run: |
          git add -N specs/90-traceability.md
          if ! git diff --exit-code -- specs/90-traceability.md; then
            echo "specs/90-traceability.md is stale — run: python3 tools/srs_check.py and commit the result"
            exit 1
          fi

      # Only where the project keeps a grounds register; the step is
      # inert everywhere else. The dashboard is generated and committed,
      # so a stale one means the records moved and nobody looked.
      - name: Grounds register
        run: |
          if [ -f grounds/grounds-config.json ]; then
            python3 tools/srs_grounds.py
            git add -N grounds/90-dashboard.md
            if ! git diff --exit-code -- grounds/90-dashboard.md; then
              echo "grounds/90-dashboard.md is stale — run: python3 tools/srs_grounds.py and commit the result"
              exit 1
            fi
          fi

      # Only where the project keeps an architecture layer; the step is
      # inert everywhere else. The map is generated and committed, so a
      # stale one means the parts moved and nobody looked.
      - name: Architecture layer
        run: |
          if [ -f arch/arch-config.json ]; then
            python3 tools/srs_arch.py
            git add -N arch/90-map.md
            if ! git diff --exit-code -- arch/90-map.md; then
              echo "arch/90-map.md is stale — run: python3 tools/srs_arch.py and commit the result"
              exit 1
            fi
          fi

      # The readable specification as one self-contained HTML file,
      # downloadable from the run's Artifacts. Delete these two steps if
      # you do not want it.
      - name: Render the specification
        run: |
          python3 tools/srs_view.py --html site/index.html \
            --repo-url "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}"

      - uses: actions/upload-artifact@v7
        with:
          name: specification
          path: site

      # To publish through GitHub Pages instead of downloading the
      # artifact, enable Pages for the repository (Settings → Pages →
      # source "GitHub Actions") and uncomment the block below; it needs
      # `permissions: {pages: write, id-token: write}` on this job.
      # - uses: actions/configure-pages@v6
      # - uses: actions/upload-pages-artifact@v5
      #   with:
      #     path: site
      # - uses: actions/deploy-pages@v5
