# SRS-DD-0.24.0 specification gate.
# Template copied into target projects as .github/workflows/srs.yml by
# tools/srs_init.py.

name: srs

on:
  push:
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      # The whole history: the baselines the rendered page compares are
      # commits in it, and the default shallow checkout holds none of them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The references between the parts are this project's own generated file:
      # the architecture layer's model is compared against them, and the checker
      # reads imports in Python only, so for a Swift project they are supplied.
      # Produced from the code rather than kept, and a push that leaves them
      # stale fails here (FR-TOOL-330, FR-TOOL-340).
      #
      # file implements: FR-TOOL-340
      - name: References between the parts
        run: python3 scripts/arch-edges.py --check

      # The gate is srs-dd/tools/srs_gate.py, refreshed with the rest of the
      # tooling, so this step has nothing to change when the gate does: it
      # runs the checker — and the grounds register's and the architecture
      # layer's where the project keeps them — and fails on any generated
      # file that differs from the one committed. Add --strict to fail on
      # warnings as well.
      - name: Specification gate
        run: python3 srs-dd/tools/srs_gate.py

      # The readable specification as one self-contained HTML file, and the page
      # of each optional layer this project keeps beside it, each told which
      # others will be there. Downloadable from the run's Artifacts; delete these
      # two steps if you do not want them. `if` rather than `[ -d x ] && …`,
      # which under `set -e` fails the step where the directory is absent.
      - name: Render the pages
        run: |
          beside=""
          if [ -d arch ]; then beside="arch.html"; fi
          if [ -d grounds ]; then beside="${beside:+$beside,}grounds.html"; fi
          python3 srs-dd/tools/srs_view.py --html site/index.html \
            ${beside:+--link "$beside"} \
            --repo-url "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}"
          if [ -d arch ]; then
            others="index.html"
            if [ -d grounds ]; then others="index.html,grounds.html"; fi
            python3 srs-dd/tools/srs_arch_doc.py --html --link "$others" > site/arch.html
          fi
          if [ -d grounds ]; then
            others="index.html"
            if [ -d arch ]; then others="index.html,arch.html"; fi
            python3 srs-dd/tools/srs_grounds.py --html --link "$others" > site/grounds.html
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: specification
          path: site

      # To publish through GitHub Pages instead of downloading the
      # artifact, enable Pages for the repository (Settings → Pages →
      # source "GitHub Actions") and uncomment the block below; it needs
      # `permissions: {pages: write, id-token: write}` on this job.
      # - uses: actions/configure-pages@v6
      # - uses: actions/upload-pages-artifact@v5
      #   with:
      #     path: site
      # - uses: actions/deploy-pages@v5
